name: Feature request
description: Suggest a focused, privacy-preserving DOCX audit check.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Document QA problem
      description: What failure should the tool detect, and who encounters it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed check or output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This can be reproduced without uploading a confidential document.
          required: true

