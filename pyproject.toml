[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docx-audit"
version = "0.1.0"
description = "Local, privacy-first checks for DOCX text, placeholders, and revision colors."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yao Yao" }]
keywords = ["docx", "quality-assurance", "contracts", "privacy"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
docx-audit = "docx_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
